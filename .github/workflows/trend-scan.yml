name: Crypto Trend Scan

on:
  schedule:
    # 4시간마다 (UTC 0/4/8/12/16/20 → KST 09/13/17/21/01/05시)
    - cron: '5 */4 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # 회차 간 비교용 state/latest.json 커밋

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trend bot
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          COINGECKO_API_KEY:    ${{ secrets.COINGECKO_API_KEY }}
        run: python trend_bot.py

      - name: Persist ranking for next run
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "순위 변화 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.json
          git commit -m "Record ranking snapshot [skip ci]"
          # 동시 실행이 겹쳐도 스냅샷 때문에 잡이 실패하진 않게 한다
          git pull --rebase --autostash origin master && git push origin HEAD:master \
            || echo "스냅샷 푸시 실패 — 다음 회차에 다시 시도"
